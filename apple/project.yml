name: ArcVoice
options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true

targets:
  ArcVoice:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: ArcVoice
        excludes:
          - Info.plist
    info:
      path: ArcVoice/Info.plist
      properties:
        CFBundleDisplayName: ArcVoice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: EPUB Book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaczmarowski.arcvoice
        DEVELOPMENT_TEAM: LYLLW4UMWG
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        # The voice engine (apple/build-core.sh) and what it links against.
        OTHER_LDFLAGS: "-lc++ -liconv -framework CoreML -framework Security"
        # ONNX Runtime's simulator build is for Apple Silicon Macs only.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    dependencies:
      - framework: Frameworks/ArcVoiceCore.xcframework
        embed: false

  ArcVoiceMac:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - path: ArcVoice
        excludes:
          - Info.plist
    info:
      path: ArcVoiceMac/Info.plist
      properties:
        CFBundleDisplayName: ArcVoice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.books
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: EPUB Book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
    entitlements:
      path: ArcVoiceMac/ArcVoiceMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_NAME: ArcVoice
        PRODUCT_BUNDLE_IDENTIFIER: com.kaczmarowski.arcvoice
        DEVELOPMENT_TEAM: LYLLW4UMWG
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true
        OTHER_LDFLAGS: "-lc++ -liconv -framework CoreML -framework Security"
        # ONNX Runtime ships for Apple Silicon Macs only.
        ARCHS: arm64
    dependencies:
      - framework: Frameworks/ArcVoiceCore.xcframework
        embed: false
