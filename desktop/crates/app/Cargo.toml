[package]
name = "arcvoice"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reads PDFs aloud on this computer with the Kokoro voice"

[features]
default = ["ort-bundled"]
ort-bundled = ["arcvoice-core/ort-bundled"]
ort-dynamic = ["arcvoice-core/ort-dynamic"]

[dependencies]
anyhow = "1"
arcvoice-core = { path = "../core", default-features = false }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.15"
rodio = { version = "0.21", default-features = false, features = ["playback"] }
