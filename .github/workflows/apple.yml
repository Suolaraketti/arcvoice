name: Apple apps

on:
  push:
    paths:
      - "apple/**"
      - "desktop/crates/core/**"
      - "desktop/crates/ffi/**"
      - "desktop/Cargo.lock"
      - ".github/workflows/apple.yml"
  workflow_dispatch:

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iPhone and Mac apps
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Rust for iOS
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # The voice engine is the shared Rust code in desktop/, built as a
      # static library for the iPhone, the Simulator and the Mac.
      - name: Build the voice engine
        run: ./build-core.sh

      - name: Generate the Xcode project
        run: xcodegen

      - name: Build for iPhone
        run: |
          set -o pipefail
          xcodebuild build \
            -project ArcVoice.xcodeproj \
            -scheme ArcVoice \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee ios-build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" ios-build.log

      - name: Build for Mac
        run: |
          set -o pipefail
          xcodebuild build \
            -project ArcVoice.xcodeproj \
            -scheme ArcVoiceMac \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            | tee mac-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" mac-build.log

      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-build-logs
          path: apple/*-build.log
          if-no-files-found: ignore
